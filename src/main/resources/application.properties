spring.application.name=filler
server.port=8082

# ==========================================
# CONEXIÓN A POSTGRESQL LOCAL EN DOCKER
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=elkesoeweko
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Coso Azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/discovery/v2.0/keys

# Configuración de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5

# Listener y Modo Manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Reintentos con Exponential Backoff
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3

spring.profiles.active=rabbit
# Apaga la autoconexión de RabbitMQ por ahora
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ==========================================
# CONFIGURACIÓN DE APACHE KAFKA
# ==========================================
# Conexión al broker expuesto en tu docker-compose (puerto 9092)
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

# --- PRODUCTOR (Convierte tus objetos Java/DTO a JSON) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Confirmación de escritura para asegurar que el broker recibió el mensaje
spring.kafka.producer.acks=all

# --- CONSUMIDOR (Convierte el JSON que llega de Kafka a tus DTO) ---
spring.kafka.consumer.group-id=filler-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Permite deserializar tus paquetes DTO sin errores de seguridad de Spring
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# --- ADMINISTRADOR DE KAFKA (KafkaAdmin) ---
spring.kafka.admin.properties.bootstrap.servers=localhost:9092,localhost:9093,localhost:9094