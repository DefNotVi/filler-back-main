spring.application.name=filler
server.port=8082

# ==========================================
# CONEXIÓN A POSTGRESQL LOCAL EN DOCKER
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=elkesoeweko
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Coso Azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/discovery/v2.0/keys

# Configuración de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5

# Listener y Modo Manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Reintentos con Exponential Backoff
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3