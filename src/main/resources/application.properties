spring.application.name=filler
server.port=8082

# Configuración de la Base de Datos en Memoria (H2)
spring.datasource.url=jdbc:h2:mem:tinderotakudb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Habilitar la consola web de H2 para ver las tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Coso Azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/87c304cc-22d8-44f5-8876-e82e9b090abb/discovery/v2.0/keys

# Configuración de RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Listener y Modo Manual
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Reintentos con Exponential Backoff
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-attempts=3